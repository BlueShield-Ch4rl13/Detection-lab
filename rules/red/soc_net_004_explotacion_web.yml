title: Explotacion de vulnerabilidad web contra un servicio publicado
id: 20211dde-9127-51b1-8208-994bc119ba45
status: experimental
description: |
    Patrones de explotacion en la peticion HTTP: inyeccion SQL, traversal, deserializacion,
    JNDI y ejecucion de plantilla. Pensada para el log del WAF o del proxy inverso, que
    es donde llega la peticion completa.
references:
    - https://attack.mitre.org/techniques/T1190/
author: SOC Detection Pack
date: 2026/08/27
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection_jndi:
        c-uri|contains:
            - '${jndi:'
            - '%24%7Bjndi'
            - '${lower:j}'
    selection_traversal:
        c-uri|contains:
            - '../../'
            - '..%2f..%2f'
            - '%2e%2e%2f'
            - '/etc/passwd'
            - 'c:\windows\win.ini'
    selection_sqli:
        c-uri|contains:
            - ' union select'
            - 'union+select'
            - "' or 1=1"
            - 'sleep(5)'
            - 'benchmark('
            - 'waitfor delay'
    selection_deser:
        c-uri|contains:
            - 'rO0AB'
            - 'aced0005'
            - '__proto__'
    selection_ssti:
        c-uri|contains:
            - '${T(java.lang.Runtime)'
            - '{{7*7}}'
            - '<%= '
    condition: 1 of selection_*
falsepositives:
    - Escaneres de vulnerabilidad autorizados, que deben estar acotados por IP origen y ventana
level: high
