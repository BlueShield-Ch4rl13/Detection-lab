title: Cradle de descarga en PowerShell
id: 3cfcaf5b-001e-5d80-956b-c2068a443689
status: experimental
description: PowerShell descargando y ejecutando codigo desde red (DownloadString/IEX).
references:
- https://attack.mitre.org/techniques/T1105
author: C. Villalba
date: 2026/07/16
tags:
- attack.execution
- attack.t1059.001
- attack.command-and-control
- attack.t1105
- iso27001-2022.a-8-7
- nist.cm-7
- nist.sc-7
- nist.si-3
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \powershell.exe
    CommandLine|contains:
    - DownloadString
    - DownloadFile
    - Net.WebClient
    - Invoke-WebRequest
    - IEX
    - Invoke-Expression
  condition: selection
falsepositives:
- Instaladores legitimos que usan PowerShell
level: high
