title: PowerShell codificado u ofuscado
id: 42d67036-72b0-52b3-a8be-d59d6f24fcd8
status: experimental
description: |
    Detecta las tecnicas habituales de ofuscacion en PowerShell: comando codificado en
    base64, reconstruccion de cadenas, ejecucion desde memoria y bypass de politica de
    ejecucion. Rara vez hay una razon legitima para lanzar PowerShell con -enc en un
    puesto de usuario.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
author: SOC Detection Pack
date: 2026/08/27
tags:
    - attack.execution
    - attack.defense-evasion
    - attack.t1059.001
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_ofuscacion:
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand'
            - ' -e JAB'
            - 'FromBase64String'
            - '[Convert]::FromBase64'
            - '-nop -w hidden'
            - '-NoProfile -WindowStyle Hidden'
            - 'IEX(New-Object'
            - 'iex (New-Object'
            - '[Reflection.Assembly]::Load'
            - '-ExecutionPolicy Bypass'
    condition: selection_ps and selection_ofuscacion
falsepositives:
    - Herramientas de gestion que invocan PowerShell codificado, como algunas tareas de SCCM
level: high
