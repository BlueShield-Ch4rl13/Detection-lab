title: Documento de Office lanzando shell
id: 86a9cd62-a27b-55eb-892c-223a8f532cad
status: experimental
description: 'Word/Excel/Outlook creando cmd/powershell/wscript: tipico de phishing
  con macros.'
references:
- https://attack.mitre.org/techniques/T1204/002/
author: C. Villalba
date: 2026/07/16
tags:
- attack.execution
- attack.t1204.002
- attack.initial-access
- attack.t1566.001
- iso27001-2022.a-6-3
- iso27001-2022.a-8-23
- iso27001-2022.a-8-7
- nist.at-2
- nist.si-3
- nist.si-8
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \outlook.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  condition: selection
falsepositives:
- Plantillas corporativas con macros legitimas
level: high
