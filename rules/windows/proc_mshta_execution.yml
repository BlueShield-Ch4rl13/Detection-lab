title: Ejecucion sospechosa de mshta
id: 1f14dff6-df0a-5c43-b652-978cd78e826e
status: experimental
description: mshta ejecutando HTA remoto o javascript/vbscript inline.
references:
- https://attack.mitre.org/techniques/005
author: C. Villalba
date: 2026/07/16
tags:
- attack.defense-evasion
- attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \mshta.exe
    CommandLine|contains:
    - http
    - 'javascript:'
    - 'vbscript:'
  condition: selection
falsepositives:
- Aplicaciones legacy que usan HTA
level: high
