title: PowerShell con comando codificado
id: 78911e60-b095-5b4a-aa20-9f27a7bc1bd5
status: experimental
description: Detecta powershell.exe con -EncodedCommand/-enc, comun en cargas ofuscadas.
references:
- https://attack.mitre.org/techniques/T1562/001
author: C. Villalba
date: 2026/07/16
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \powershell.exe
    CommandLine|contains:
    - -enc
    - -EncodedCommand
    - ' -e '
  condition: selection
falsepositives:
- Scripts de administracion codificados (raro)
level: high
