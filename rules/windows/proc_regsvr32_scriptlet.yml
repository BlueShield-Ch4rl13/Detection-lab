title: Regsvr32 ejecutando scriptlet remoto (Squiblydoo)
id: 12fc9c06-e5c9-5e06-8b38-fd2e753c802c
status: experimental
description: regsvr32 /i:http ... scrobj.dll para ejecutar codigo remoto evadiendo
  controles.
references:
- https://attack.mitre.org/techniques/T1218/010
author: C. Villalba
date: 2026/07/16
tags:
- attack.defense-evasion
- attack.t1218.010
- iso27001-2022.a-8-7
- nist.cm-7
- nist.si-3
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \regsvr32.exe
    CommandLine|contains:
    - /i:http
    - scrobj.dll
  condition: selection
falsepositives:
- Ninguno esperado
level: high
