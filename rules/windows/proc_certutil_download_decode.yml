title: Certutil usado para descargar o decodificar
id: 6fc6a8a8-2531-5c23-a6cd-c52f20ecd0d6
status: experimental
description: certutil -urlcache (descarga) o -decode (LOLBin de descarga/ofuscacion).
references:
- https://attack.mitre.org/techniques/T1140
author: C. Villalba
date: 2026/07/16
tags:
- attack.command-and-control
- attack.t1105
- attack.defense-evasion
- attack.t1140
- iso27001-2022.a-8-7
- nist.sc-7
- nist.si-3
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \certutil.exe
    CommandLine|contains:
    - urlcache
    - -decode
    - -decodehex
    - split
  condition: selection
falsepositives:
- Uso administrativo legitimo de certutil (poco comun)
level: high
