title: Indicadores de Mimikatz en linea de comandos
id: 8553ddab-9379-519b-8ed8-fbc8a931c5cb
status: experimental
description: Comandos tipicos de Mimikatz (sekurlsa, logonpasswords, etc.).
references:
- https://attack.mitre.org/techniques/001
author: C. Villalba
date: 2026/07/16
tags:
- attack.credential_access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - sekurlsa
    - logonpasswords
    - lsadump
    - privilege::debug
    - 'kerberos::'
  condition: selection
falsepositives:
- Ninguno esperado
level: critical
