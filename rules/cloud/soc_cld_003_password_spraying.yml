title: Fallo de autenticacion en Entra ID por credencial invalida
id: 1038900a-3eda-5fbb-941a-33346dcab9e4
name: soc_cld_003_fallo_credencial
status: stable
description: |
    Regla base del password spraying. Aisla los codigos de resultado que corresponden a
    credencial invalida (50126), cuenta bloqueada (50053) y cuenta deshabilitada (50055).
    Por si sola no alerta: la senal esta en la correlacion posterior.
references:
    - https://attack.mitre.org/techniques/T1110/003/
    - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
author: SOC Detection Pack
date: 2026/08/27
tags:
    - attack.credential-access
    - attack.t1110.003
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        ResultType:
            - '50126'
            - '50053'
            - '50055'
    condition: selection
falsepositives:
    - Errores puntuales de usuario, que es la razon de no alertar sobre esta regla base
level: informational
---
title: Password spraying contra Entra ID
id: 69702e46-a05c-5f88-9936-3f46fd5fbcd0
status: stable
description: |
    Muchos usuarios distintos con pocos intentos cada uno desde un mismo origen. Es el
    patron que evade el bloqueo por cuenta, porque nunca acumula suficientes fallos
    sobre un solo usuario. Quince cuentas distintas en una hora desde la misma IP no
    tiene explicacion benigna salvo NAT compartido.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: SOC Detection Pack
date: 2026/08/27
tags:
    - attack.credential-access
    - attack.t1110.003
    - iso27001-2022.a-8-5
    - nist.ac-7
    - nist.ia-2
correlation:
    type: value_count
    rules:
        - soc_cld_003_fallo_credencial
    group-by:
        - IPAddress
    timespan: 1h
    condition:
        gte: 15
        field: UserPrincipalName
falsepositives:
    - Salidas NAT compartidas por muchos usuarios, que hay que excluir por IP
    - Errores masivos tras un cambio forzado de politica de contrasenas
level: high
