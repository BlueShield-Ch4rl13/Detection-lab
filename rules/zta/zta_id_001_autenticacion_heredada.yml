title: Uso de protocolo de autenticacion heredado
id: 89d197a1-f243-587e-a32e-3326790b3d26
status: experimental
description: |
    Pilar de identidad. Los protocolos heredados (IMAP, POP3, SMTP AUTH, ActiveSync
    basico) no soportan MFA ni acceso condicional: una credencial valida basta para
    entrar. Son la puerta que queda abierta despues de desplegar MFA, y la que usan
    casi todos los rociados de contrasenas que tienen exito.
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://csrc.nist.gov/pubs/sp/800/207/final
author: BlueShield-Ch4rl13
date: 2026-08-31
tags:
    - attack.defense-evasion
    - attack.initial-access
    - attack.t1078.004
    - attack.t1556.006
    - iso27001-2022.a-5-15
    - iso27001-2022.a-8-2
    - iso27001-2022.a-8-5
    - nist.ac-2
    - nist.ac-6
    - nist.ia-2
logsource:
    product: azure
    service: signinlogs
detection:
    selection_correcto:
        ResultType: '0'
    selection_heredado:
        ClientAppUsed:
            - 'IMAP4'
            - 'POP3'
            - 'SMTP'
            - 'MAPI Over HTTP'
            - 'Exchange ActiveSync'
            - 'Other clients'
            - 'Authenticated SMTP'
            - 'Exchange Web Services'
    condition: selection_correcto and selection_heredado
falsepositives:
    - Multifuncionales y aplicaciones que envian correo por SMTP autenticado, que hay que inventariar y excluir por cuenta
level: high
