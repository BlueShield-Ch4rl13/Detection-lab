title: Manipulacion del canal de telemetria ETW
id: df839973-dc16-57d5-a385-a791c31c0cdd
status: experimental
description: |
    Antes de actuar, el atacante corta la fuente en lugar de borrar el resultado: para
    DiagTrack, desactiva el autologger que alimenta al sensor o apaga un canal concreto
    con wevtutil. El ataque es mas limpio que borrar registros porque no deja el evento
    1102 ni un hueco evidente, simplemente el equipo deja de contar cosas. La regla
    exige que wevtutil venga con /e:false, para no repetir la deteccion generica ya
    existente sobre wevtutil.
references:
    - https://attack.mitre.org/techniques/T1562/002/
    - https://attack.mitre.org/techniques/T1562/006/
author: BlueShield-Ch4rl13
date: 2026-08-31
tags:
    - attack.defense-evasion
    - attack.t1562.002
    - attack.t1562.006
    - iso27001-2022.a-8-7
    - nist.au-9
    - nist.cm-7
    - nist.si-3
logsource:
    category: process_creation
    product: windows
detection:
    selection_servicio:
        CommandLine|contains:
            - 'stop DiagTrack'
            - 'delete DiagTrack'
            - 'config DiagTrack'
            - 'Stop-Service DiagTrack'
            - 'Set-Service DiagTrack'
            - 'stop diagnosticshub.standardcollector.service'
    selection_autologger:
        CommandLine|contains:
            - '\WMI\Autologger\'
            - 'Autologger\EventLog-'
            - 'Autologger\DefenderApiLogger'
            - 'Autologger\DefenderAuditLogger'
            - 'Autologger\SenseEventLog'
            - 'Autologger\Diagtrack-Listener'
    selection_wevtutil:
        CommandLine|contains:
            - 'wevtutil sl'
            - 'wevtutil.exe sl'
            - 'Set-LogProperties'
    selection_wevtutil_apagado:
        CommandLine|contains:
            - '/e:false'
            - '/enabled:false'
            - '-Enabled $false'
    selection_etw:
        CommandLine|contains:
            - 'Set-EtwTraceProvider'
            - 'Remove-EtwTraceProvider'
            - 'Remove-EtwTraceSession'
    selection_logman:
        CommandLine|contains:
            - 'logman stop'
            - 'logman.exe stop'
            - 'logman update trace'
            - 'logman.exe update trace'
    selection_logman_objetivo:
        CommandLine|contains:
            - '-ets'
            - 'EventLog-'
            - 'Autologger'
            - 'DefenderApiLogger'
            - 'SenseEvent'
    condition: selection_servicio or selection_autologger or selection_etw or (selection_wevtutil and selection_wevtutil_apagado) or (selection_logman and selection_logman_objetivo)
falsepositives:
    - Bastionado de privacidad que desactiva DiagTrack por politica, que debe verse en el despliegue completo y no en un equipo aislado
    - Diagnostico de rendimiento con logman por parte de soporte, acotado a una ventana y a un equipo con incidencia abierta
level: high
