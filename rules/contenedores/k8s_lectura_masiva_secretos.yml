title: Lectura de secretos de Kubernetes
id: 1ac2a767-fb50-5649-b181-1b7d7c12090d
status: experimental
description: |
    Los secretos del cluster contienen tokens de service account, credenciales de
    registro y claves de aplicacion. Un list sobre todos los secretos de un
    namespace es enumeracion, no uso normal: las cargas legitimas leen el suyo,
    montado por el kubelet, no consultan la API.
references:
    - https://attack.mitre.org/techniques/T1552/007/
author: BlueShield-Ch4rl13
date: 2026-08-31
tags:
    - attack.credential-access
    - attack.t1552.007
    - iso27001-2022.a-5-17
    - nist.ia-5
    - nist.sc-28
logsource:
    product: kubernetes
    service: audit
detection:
    selection:
        verb:
            - 'get'
            - 'list'
            - 'watch'
        resource: 'secrets'
    filtro_controladores:
        username|startswith:
            - 'system:serviceaccount:kube-system:'
            - 'system:kube-controller-manager'
            - 'system:apiserver'
    condition: selection and not filtro_controladores
falsepositives:
    - Operadores y controladores propios, que deben reconocerse por su service account
level: medium
