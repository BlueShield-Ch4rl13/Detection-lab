title: Borrado de registros del sistema en macOS
id: 48094831-81d9-5cb0-910c-8e544f883835
status: experimental
description: |
    Borrado del Unified Log, de los ASL heredados o del historial de shell. Es
    actividad anti-forense: se ejecuta despues del objetivo, no antes, asi que
    verlo suele significar que ya ha pasado algo.
references:
    - https://attack.mitre.org/techniques/T1070/002/
author: BlueShield-Ch4rl13
date: 2026-08-31
tags:
    - attack.defense-evasion
    - attack.t1070.002
    - attack.t1070.003
logsource:
    category: process_creation
    product: macos
detection:
    selection_log:
        Image|endswith: '/log'
        CommandLine|contains: 'erase'
    selection_rutas:
        CommandLine|contains:
            - '/var/log/asl'
            - '/private/var/log/'
            - '/var/db/diagnostics'
            - '.zsh_history'
            - '.bash_history'
    selection_borrado:
        Image|endswith:
            - '/rm'
            - '/shred'
            - '/srm'
    selection_historial:
        CommandLine|contains:
            - 'unset HISTFILE'
            - 'HISTSIZE=0'
            - 'set +o history'
    condition: selection_log or (selection_rutas and selection_borrado) or selection_historial
falsepositives:
    - Limpieza de disco por scripts de mantenimiento, que deberian estar inventariados
level: high
