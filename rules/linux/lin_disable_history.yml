title: Deshabilitar historial de shell (anti-forense)
id: 08fecbad-072d-5720-af42-a5fc54a420a7
status: experimental
description: unset HISTFILE / HISTSIZE=0 / ln -sf /dev/null ~/.bash_history.
references:
- https://attack.mitre.org/techniques/T1070/003/
author: C. Villalba
date: 2026/07/16
tags:
- attack.defense-evasion
- attack.t1070.003
- iso27001-2022.a-8-15
- nist.au-11
- nist.au-9
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
    - unset HISTFILE
    - HISTFILE=/dev/null
    - HISTSIZE=0
    - export HISTSIZE=0
  condition: selection
falsepositives:
- Preferencias legitimas de usuarios avanzados
level: medium
