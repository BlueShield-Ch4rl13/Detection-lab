title: Adicion de clave SSH (authorized_keys)
id: 91efd863-d033-552f-9f65-782761f7ccbc
status: experimental
description: Escritura en authorized_keys para acceso persistente.
references:
- https://attack.mitre.org/techniques/T1098/004/
author: C. Villalba
date: 2026/07/16
tags:
- attack.persistence
- attack.t1098.004
- iso27001-2022.a-5-16
- iso27001-2022.a-5-18
- nist.ac-2
- nist.ac-6
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains: authorized_keys
  selection_write:
    CommandLine|contains:
    - echo
    - tee
    - '>>'
    - '>'
    - cat
  condition: selection and selection_write
falsepositives:
- Aprovisionamiento legitimo de claves
level: high
