title: Permisos de ejecucion en /tmp o /dev/shm
id: 9f7e0bd9-6dc3-507a-bc3d-ccd37de8defc
status: experimental
description: chmod +x sobre binarios soltados en directorios de escritura mundial.
references:
- https://attack.mitre.org/techniques/T1222/002/
author: C. Villalba
date: 2026/07/16
tags:
- attack.defense-evasion
- attack.t1222.002
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains|all:
    - chmod
    CommandLine|contains:
    - /tmp/
    - /dev/shm/
    - /var/tmp/
  selection_x:
    CommandLine|contains:
    - +x
    - '0755'
    - '777'
  condition: selection and selection_x
falsepositives:
- Compilacion/instalacion legitima en /tmp
level: medium
