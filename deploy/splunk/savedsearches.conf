cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Modificacion sospechosa de directiva de grupo
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1484.001
# Regla Sigma: rules\windows\soc_ad_010_abuso_gpo.yml
