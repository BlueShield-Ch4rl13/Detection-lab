search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11 TargetFilename IN ("*.locked", "*.encrypted", "*.crypt", "*.lockbit", "*.blackcat", "*.royal", "*.akira", "*.basta", "*.cactus", "*.play") OR TargetFilename IN ("*readme_for_decrypt*", "*how_to_decrypt*", "*recover_your_files*", "*restore-my-files*", "*_readme.txt*", "*HOW TO BACK FILES*", "*RESTORE_FILES_INFO*")
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Cifrado masivo de ficheros por ransomware
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
