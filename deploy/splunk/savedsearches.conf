cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Herramienta de abuso de Kerberos ejecutada
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1003,T1558
# Regla Sigma: rules\windows\soc_ad_005_herramientas_kerberos.yml
# UUID: 8326ba13-ff5b-50a8-a31b-acdc642cb6b6

[DL - Pass-the-Hash y Overpass-the-Hash]
