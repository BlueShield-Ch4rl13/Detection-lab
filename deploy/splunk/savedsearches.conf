[DL - Instalacion de paquete desde un repositorio no aprobado]
description = Pilar de cadena de suministro software. Instalar directamente desde un indice publico o desde una URL salta el repositorio interno, y con el se saltan el escaneo de vulnerabilidades, la firma y el inventario. Es tambien la via por la que entra un paquete con nombre confundible (typosquatting).
search = index="endpoint" sourcetype="linux:audit" Image IN ("*/pip", "*/pip3", "*/npm", "*/yarn", "*/gem", "*/go", "*/cargo", "*/composer") CommandLine IN ("*install git+*", "*install http://*", "*install https://*", "*--index-url*", "*--extra-index-url*", "*--registry*", "*install github.com/*") OR (CommandLine="*curl*" CommandLine="*install*") NOT (CommandLine IN ("*repo.midominio.local*", "*nexus.midominio.local*", "*artifactory.midominio.local*"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Instalacion de paquete desde un repositorio no aprobado
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1195.001,T1195.002
# Regla Sigma: rules\zta\zta_sup_002_paquete_repositorio_no_aprobado.yml
# UUID: 5dd0df5c-e15a-59df-9bff-b236a7a0d6b0

[DL - Modificacion de un fichero de dependencias o lockfile]
description = Pilar de cadena de suministro software. El lockfile es lo que garantiza que lo que se compila hoy es lo mismo que se auditó ayer. Modificarlo fuera de un commit revisado, sobre todo en un servidor de compilacion, es la forma limpia de introducir una dependencia maliciosa sin tocar el codigo fuente.
search = TargetFilename IN ("*/package-lock.json", "*/yarn.lock", "*/pnpm-lock.yaml", "*/poetry.lock", "*/Pipfile.lock", "*/requirements.txt", "*/go.sum", "*/Cargo.lock", "*/composer.lock", "*/Gemfile.lock") NOT (Image IN ("*/git", "*/npm", "*/yarn", "*/pnpm", "*/poetry", "*/pip", "*/pip3", "*/go", "*/cargo", "*/composer", "*/bundle"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Modificacion de un fichero de dependencias o lockfile
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1195.001
# Regla Sigma: rules\zta\zta_sup_003_fichero_dependencias_modificado.yml
# UUID: 933f7737-80c7-5bdb-8ce2-e857119ac34d

[DL - Borrado o reduccion del registro de auditoria]
description = Capacidad transversal de visibilidad y analitica del modelo CISA. Sin registro no hay deteccion, y por eso su manipulacion es uno de los primeros movimientos tras conseguir privilegios. Cubre el borrado del canal, la desactivacion de categorias de auditoria y la reduccion del tamano de retencion, que es la version silenciosa del borrado.
search = source="WinEventLog:Security" EventCode IN (1102, 1100) OR EventCode=4719
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
