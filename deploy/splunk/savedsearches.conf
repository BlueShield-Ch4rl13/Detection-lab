[DL - Uso de protocolo de autenticacion heredado]
description = Pilar de identidad. Los protocolos heredados (IMAP, POP3, SMTP AUTH, ActiveSync basico) no soportan MFA ni acceso condicional: una credencial valida basta para entrar. Son la puerta que queda abierta despues de desplegar MFA, y la que usan casi todos los rociados de contrasenas que tienen exito.
search = index="idp" sourcetype="azure:aad:signin" ResultType="0" ClientAppUsed IN ("IMAP4", "POP3", "SMTP", "MAPI Over HTTP", "Exchange ActiveSync", "Other clients", "Authenticated SMTP", "Exchange Web Services")
