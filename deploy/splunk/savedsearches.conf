dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Uso de protocolo de autenticacion heredado
action.notable.param.security_domain = threat
