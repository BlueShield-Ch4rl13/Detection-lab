[DL - Kerberoasting - solicitud masiva de tickets de servicio con RC4]
description = Detecta solicitudes de ticket de servicio (TGS) cifradas con RC4 contra cuentas de servicio. Un atacante pide el TGS de cuentas con SPN para crackear su contrasena fuera de linea. El cifrado RC4 (0x17) es la senal: los clientes modernos negocian AES, asi que un RC4 solicitado por un puesto de usuario es anomalo.
search = source="WinEventLog:Security" EventCode=4769 TicketOptions="0x40810000" TicketEncryptionType="0x17" NOT (ServiceName IN ("*$", "krbtgt"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Kerberoasting - solicitud masiva de tickets de servicio con RC4
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1558.003
# Regla Sigma: rules\windows\soc_ad_001_kerberoasting.yml
# UUID: 54b36280-b579-5b0d-af3a-3ff82ad085f2

[DL - AS-REP Roasting - peticion sin preautenticacion Kerberos]
description = Detecta peticiones de autenticacion Kerberos (AS-REQ) sobre cuentas que tienen deshabilitada la preautenticacion. El atacante recibe material cifrado con la contrasena del usuario y lo craquea sin tocar el dominio. Se apoya en el evento 4768 con PreAuthType 0.
search = source="WinEventLog:Security" EventCode=4768 PreAuthType=0 TicketEncryptionType="0x17" NOT TargetUserName="*$"
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = AS-REP Roasting - peticion sin preautenticacion Kerberos
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1558.004
# Regla Sigma: rules\windows\soc_ad_002_asrep_roasting.yml
# UUID: 05ce8c8f-92c0-5450-9da3-3d957a21566f

[DL - DCSync - replicacion de directorio desde un equipo que no es DC]
description = Detecta el uso de los permisos de replicacion de Active Directory para extraer hashes de contrasena, la tecnica que usa mimikatz lsadump::dcsync. Se identifica por el acceso a los GUID de extended right de replicacion en el evento 4662. Si el solicitante no es una cuenta de equipo controlador de dominio, es un ataque.
search = source="WinEventLog:Security" EventCode=4662 Properties IN ("*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*", "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*", "*89e95b76-444d-4c62-991a-0facbeda640c*") NOT (SubjectUserName="*$" OR SubjectUserName IN ("ANONYMOUS LOGON", "SYSTEM"))
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = DCSync - replicacion de directorio desde un equipo que no es DC
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1003.006
# Regla Sigma: rules\windows\soc_ad_003_dcsync.yml
# UUID: c99d10d7-e44d-5516-b637-3ec1ccf42c9e

[DL - Indicio de Golden Ticket - TGS de krbtgt con cifrado degradado]
description = Un Golden Ticket es un TGT forjado con el hash de krbtgt. Mimikatz lo genera por defecto con RC4, asi que una peticion de servicio que involucra a krbtgt con cifrado 0x17 desde un equipo que no es DC es sospechosa. Complementar siempre con revision del ticket lifetime, que en los tickets forjados suele ser de 10 anos.
search = source="WinEventLog:Security" EventCode=4769 ServiceName="krbtgt*" TicketEncryptionType="0x17"
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Indicio de Golden Ticket - TGS de krbtgt con cifrado degradado
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1558.001
# Regla Sigma: rules\windows\soc_ad_004_golden_ticket.yml
# UUID: da924d29-69e6-5216-aa30-7765e1e2ebb7

[DL - Herramienta de abuso de Kerberos ejecutada]
description = Deteccion por linea de comandos de las utilidades habituales de abuso de Kerberos: Rubeus, mimikatz, kekeo e impacket. Complementa las detecciones basadas en eventos de seguridad, que se pueden evadir con implementaciones propias, y cubre el caso en que el binario se ha renombrado gracias a OriginalFileName.
