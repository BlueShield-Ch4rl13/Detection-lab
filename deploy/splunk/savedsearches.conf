[DL - Fallo de autenticacion en Entra ID por credencial invalida]
description = Regla base del password spraying. Aisla los codigos de resultado que corresponden a credencial invalida (50126), cuenta bloqueada (50053) y cuenta deshabilitada (50055). Por si sola no alerta: la senal esta en la correlacion posterior.
search = index="idp" sourcetype="azure:aad:signin" ResultType IN ("50126", "50053", "50055") \
 \
| bin _time span=1h \
| stats dc(UserPrincipalName) as value_count by _time IPAddress \
 \
| search value_count >= 15
cron_schedule = 30 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
alert.severity = 2
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Fallo de autenticacion en Entra ID por credencial invalida
action.notable.param.security_domain = threat
action.notable.param.severity = informational
action.notable.param.drilldown_name = Ver eventos de la deteccion
