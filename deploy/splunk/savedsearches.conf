search = index="endpoint" sourcetype="macos:esf" (CommandLine IN ("*TCC.db*", "*/Library/Application Support/com.apple.TCC*") Image IN ("*/sqlite3", "*/cp", "*/mv", "*/dd")) OR (Image="*/tccutil" CommandLine="*reset*")
