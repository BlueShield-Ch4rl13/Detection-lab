[DL - Tunelizacion o exfiltracion por DNS]
description = El DNS sale de casi cualquier red, lo que lo convierte en canal de reserva para C2 y exfiltracion. Las senales son la longitud de la etiqueta, el uso de tipos TXT y NULL y un numero de subdominios unicos desproporcionado para un mismo dominio padre.
search = index="network" sourcetype="suricata:eve" event_type="dns" \
| rex field=query "(?<queryMatch>^[A-Za-z0-9+/=_-]{45,}\\..*)" \
| eval queryCondition=if(isnotnull(queryMatch), "true", "false") \
| search query_type IN ("TXT", "NULL") OR queryCondition="true"
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Tunelizacion o exfiltracion por DNS
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1071.004
# Regla Sigma: rules\red\soc_net_003_dns_tunel.yml
# UUID: ec15f78d-b087-5e4d-9e01-b72d72fa253d

[DL - Explotacion de vulnerabilidad web contra un servicio publicado]
description = Patrones de explotacion en la peticion HTTP: inyeccion SQL, traversal, deserializacion, JNDI y ejecucion de plantilla. Pensada para el log del WAF o del proxy inverso, que es donde llega la peticion completa.
search = index="web" "c-uri" IN ("*${jndi:*", "*%24%7Bjndi*", "*${lower:j}*") OR "c-uri" IN ("*../../*", "*..%2f..%2f*", "*%2e%2e%2f*", "*/etc/passwd*", "*c:\\windows\\win.ini*") OR "c-uri" IN ("* union select*", "*union+select*", "*' or 1=1*", "*sleep(5)*", "*benchmark(*", "*waitfor delay*") OR "c-uri" IN ("*rO0AB*", "*aced0005*", "*__proto__*") OR "c-uri" IN ("*${T(java.lang.Runtime)*", "*{{7*7}}*", "*<%= *")
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Explotacion de vulnerabilidad web contra un servicio publicado
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1190
# Regla Sigma: rules\red\soc_net_004_explotacion_web.yml
# UUID: 20211dde-9127-51b1-8208-994bc119ba45

