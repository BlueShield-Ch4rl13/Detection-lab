dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Abuso de servicios de certificados de Active Directory
