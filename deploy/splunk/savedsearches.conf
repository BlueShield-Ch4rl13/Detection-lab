[DL - Protocolo en claro hacia un recurso que exige cifrado]
description = Pilar de redes. El cifrado extremo a extremo es uno de los siete principios de NIST SP 800-207: la red interna no se considera de confianza, asi que el trafico interno tambien va cifrado. Telnet, FTP, LDAP simple o HTTP hacia un servicio de negocio son a la vez una desviacion de la arquitectura y una oportunidad de captura de credenciales.
search = DestinationPort IN (21, 23, 69, 110, 143, 389, 512, 513, 514) Initiated="true"
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Protocolo en claro hacia un recurso que exige cifrado
action.notable.param.security_domain = threat
action.notable.param.severity = medium
