cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Suplantacion de directivo en el nombre para mostrar
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1534
# Regla Sigma: rules\correo\soc_mail_002_suplantacion_directivo.yml
# UUID: e4883bfb-93b7-5cbb-9183-205ac29f5754

[DL - Fallo de autenticacion de correo en el dominio propio]
