search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\schtasks.exe" CommandLine="*/create*" CommandLine IN ("*powershell*", "*cmd.exe /c*", "*mshta*", "*rundll32*", "*wscript*", "*cscript*", "*regsvr32*", "*\\AppData\\*", "*\\Users\\Public\\*", "*\\Temp\\*", "*http://*", "*https://*") OR CommandLine IN ("*/ru system*", "*/ru \"NT AUTHORITY\\SYSTEM\"*")
