search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image IN ("*\\AppData\\Local\\Temp\\*", "*\\Windows\\Temp\\*", "*\\Users\\Public\\*", "*\\$Recycle.Bin\\*", "*\\AppData\\Roaming\\*") Image IN ("*.exe", "*.scr", "*.com", "*.pif") NOT (ParentImage IN ("*\\msiexec.exe", "*\\setup.exe", "*\\TrustedInstaller.exe"))
