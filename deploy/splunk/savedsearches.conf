search = index="proxy" "c-uri"="*/*" NOT ("cs-categories" IN ("Business", "Search Engines", "Software Updates"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Patron de beaconing hacia un destino externo
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
