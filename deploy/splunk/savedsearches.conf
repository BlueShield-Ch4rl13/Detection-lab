cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Enumeracion de Active Directory - BloodHound y comandos de reconocimiento
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1069.002,T1087.002
# Regla Sigma: rules\windows\soc_ad_007_enumeracion_dominio.yml
# UUID: d73db06b-35ac-5211-9dc2-20ace855c116

[DL - Ejecucion remota tipo PsExec]
