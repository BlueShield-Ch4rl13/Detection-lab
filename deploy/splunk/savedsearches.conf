[DL - Persistencia por LaunchAgent o LaunchDaemon]
description = Detecta la escritura de un fichero .plist en las rutas que launchd carga automaticamente al arrancar el sistema o al iniciar sesion el usuario. Es el mecanismo de persistencia mas usado en macOS, tanto por adware como por implantes de acceso remoto.
search = index="endpoint" sourcetype="macos:esf" TargetFilename IN ("*/Library/LaunchAgents/*", "*/Library/LaunchDaemons/*", "*/Library/StartupItems/*") TargetFilename="*.plist" NOT (Image IN ("/usr/sbin/installer*", "/System/Library/PrivateFrameworks/PackageKit.framework/*", "/usr/libexec/xpcproxy*"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Persistencia por LaunchAgent o LaunchDaemon
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1543.001,T1543.004
# Regla Sigma: rules\macos\mac_persistencia_launchagent.yml
# UUID: 85b54d2d-a1e6-56d4-bc85-eb76d07aad0c

