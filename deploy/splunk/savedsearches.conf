dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Adjunto con formato usado para entrega de malware
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1566.001
# Regla Sigma: rules\correo\soc_mail_004_adjunto_sospechoso.yml
# UUID: b8df3c83-f6c3-55a1-89cb-9123ffd68050

