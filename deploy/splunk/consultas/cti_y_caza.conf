# ═══════════════════════════════════════════════════════════════════════════
# Consultas de caza e inteligencia — Splunk
#
# Escritas a mano. tools/build.py NO las regenera, porque no salen de ninguna
# regla Sigma: cruzan contra lookups externos y agregan en ventana, dos cosas
# que Sigma no expresa.
#
# Los lookups los produce tools/sync_cti.py desde News CTI. Antes de cargar
# esto, copia intel/listas/splunk/*.csv a la carpeta lookups/ de la app y
# declaralos en transforms.conf (ver deploy/splunk/INSTALAR.md).
#
# Por que la mayoria son CAZA y no ALERTA
# ---------------------------------------
# Un indicador de reputacion coincide muchas veces por motivos aburridos:
# sinkholes de investigadores, CDN compartidas, dominios reciclados, rangos de
# proveedores de nube. Desplegarlos como alerta directa llena la cola de
# eventos que se cierran sin accion, y eso entrena al turno a cerrar sin mirar.
# Solo el hash va como alerta: un hash coincide o no coincide.
# ═══════════════════════════════════════════════════════════════════════════


# ── ALERTA. Hash conocido ejecutado o escrito ─────────────────────────────
[DL CTI - Hash de la inteligencia ejecutado o escrito en disco]
description = Un proceso arranco, o un fichero aparecio en disco, con un hash presente en el feed de News CTI. A diferencia de una IP o un dominio, un hash no comparte infraestructura con nada legitimo: si coincide, coincide.
search = index=endpoint (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" (EventCode=1 OR EventCode=11 OR EventCode=15)) \
| eval hash_sha256=coalesce(SHA256, mvindex(split(mvindex(split(Hashes,"SHA256="),1),","),0)) \
| eval hash_md5=coalesce(MD5, mvindex(split(mvindex(split(Hashes,"MD5="),1),","),0)) \
| eval valor=coalesce(hash_sha256, hash_md5) \
| where isnotnull(valor) \
| lookup cti_hash valor OUTPUT amenaza nivel score fuente visto \
| where isnotnull(amenaza) \
| table _time host user Image CommandLine TargetFilename valor amenaza nivel score fuente visto
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.fields = host,valor
alert.suppress.period = 24h
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = CTI: hash conocido en el endpoint
action.notable.param.security_domain = threat
action.notable.param.severity = critical


# ── CAZA. Contacto con infraestructura de la inteligencia ─────────────────
# Umbral deliberado: no alerta por una coincidencia. Alerta cuando un mismo
# host acumula varias, o cuando el indicador es de nivel alto.
[DL CTI - Caza de contacto con infraestructura conocida]
description = Cruza conexiones salientes y resoluciones DNS contra las listas de IP y dominios de News CTI. Exige repeticion o nivel alto, porque una coincidencia suelta de reputacion casi siempre es una CDN compartida o un dominio reciclado.
search = (index=network OR index=proxy OR index=endpoint) earliest=-1h \
| eval indicador=coalesce(dest_ip, DestinationIp, query, QueryName, dest_host) \
| where isnotnull(indicador) \
| lookup cti_ip valor AS indicador OUTPUT amenaza AS amenaza_ip nivel AS nivel_ip \
| lookup cti_dominio valor AS indicador OUTPUT amenaza AS amenaza_dom nivel AS nivel_dom \
| eval amenaza=coalesce(amenaza_ip, amenaza_dom), nivel=coalesce(nivel_ip, nivel_dom) \
| where isnotnull(amenaza) \
| stats count AS coincidencias, dc(indicador) AS indicadores_distintos, \
        values(indicador) AS indicadores, values(amenaza) AS amenazas, \
        max(nivel) AS nivel_max, earliest(_time) AS primera, latest(_time) AS ultima \
        BY host \
| where coincidencias >= 3 OR indicadores_distintos >= 2 OR nivel_max="alta" \
| eval duracion_min=round((ultima-primera)/60, 1) \
| sort - coincidencias
cron_schedule = 20 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 12h
counttype = number of events
relation = greater than
quantity = 0


# ── CAZA. Explotacion de un CVE del catalogo KEV de CISA ──────────────────
[DL CTI - Caza de explotacion de CVE en el catalogo KEV]
description = Busca en los registros de servidor web y de WAF las cadenas de los CVE que CISA ha marcado como explotados activamente en los ultimos 14 dias. No es deteccion de la vulnerabilidad, es deteccion del intento.
search = (index=web OR index=proxy) earliest=-24h \
| rex field=_raw "(?<cve_visto>CVE-\d{4}-\d{4,7})" \
| where isnotnull(cve_visto) \
| lookup cti_cve_kev cve AS cve_visto OUTPUT vendor product name ransomware date_added \
| where isnotnull(product) \
| stats count AS intentos, dc(src_ip) AS origenes, values(src_ip) AS ips, \
        values(uri_path) AS rutas BY cve_visto, vendor, product, ransomware \
| sort - intentos
cron_schedule = 40 */4 * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
alert.severity = 5


# ═══════════════════════════════════════════════════════════════════════════
# Caza sin inteligencia externa: lo que se busca cuando no hay IOC
# ═══════════════════════════════════════════════════════════════════════════

# ── Procesos raros por frecuencia ─────────────────────────────────────────
# La idea: en un parque homogeneo, un binario que solo ha visto un equipo en
# treinta dias merece una mirada. No es una alerta, es una lista de trabajo.
[DL CAZA - Binarios poco frecuentes en el parque]
description = Lista los ejecutables vistos en muy pocos equipos durante los ultimos 30 dias, excluyendo rutas del sistema. Es caza de linea base, no deteccion: sirve para encontrar lo que ninguna firma cubre.
search = index=endpoint sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 earliest=-30d \
| eval bin=lower(mvindex(split(Image,"\\"),-1)) \
| search NOT Image IN ("C:\\Windows\\System32\\*", "C:\\Windows\\SysWOW64\\*", "C:\\Program Files\\*", "C:\\Program Files (x86)\\*") \
| stats dc(host) AS equipos, count AS ejecuciones, values(host) AS hosts, \
        values(ParentImage) AS padres, earliest(_time) AS primera_vez BY bin, Image \
| where equipos <= 2 \
| eval dias_desde_primera=round((now()-primera_vez)/86400, 1) \
| sort equipos, - ejecuciones


# ── Beaconing por regularidad del intervalo ───────────────────────────────
# El C2 balizado se delata por la desviacion tipica del intervalo, no por el
# destino. Un humano navegando produce intervalos irregulares; un implante, no.
[DL CAZA - Patron de baliza por regularidad temporal]
description = Calcula la desviacion tipica del intervalo entre conexiones de cada par origen-destino. Un intervalo muy regular con muchas repeticiones es la firma de una baliza, con independencia de que el destino sea conocido o no.
search = (index=network OR index=proxy) earliest=-24h \
| eval par=src_ip."->".dest_ip \
| sort 0 par, _time \
| streamstats current=f last(_time) AS anterior BY par \
| eval intervalo=_time-anterior \
| where intervalo > 0 \
| stats count AS conexiones, avg(intervalo) AS intervalo_medio, \
        stdev(intervalo) AS desviacion, sum(bytes_out) AS bytes_salida BY par, src_ip, dest_ip \
| where conexiones >= 12 AND intervalo_medio > 30 \
| eval jitter_pct=round((desviacion/intervalo_medio)*100, 1) \
| where jitter_pct < 20 \
| eval intervalo_medio=round(intervalo_medio, 1) \
| sort jitter_pct, - conexiones


# ── Primera vez que un usuario toca un recurso critico ────────────────────
[DL CAZA - Primer acceso de un usuario a un recurso sensible]
description = Compara los accesos de las ultimas 24 horas contra la linea base de 30 dias y saca los pares usuario-recurso que no habian aparecido nunca. Es la consulta que convierte un acceso legitimo en una pregunta.
search = index=fileserver earliest=-24h \
| stats earliest(_time) AS visto_ahora BY user, share \
| join type=left user, share \
    [ search index=fileserver earliest=-30d latest=-24h \
      | stats count AS historico BY user, share ] \
| where isnull(historico) \
| eval primera_vez=strftime(visto_ahora, "%Y-%m-%d %H:%M") \
| table user share primera_vez \
| sort user
