search = index="email" sourcetype="proofpoint:tap" attachmentName IN ("*.html", "*.htm", "*.svg") attachmentContent IN ("*msSaveOrOpenBlob*", "*new Blob(*", "*application/octet-stream*", "*download=*", "*atob(*", "*base64,*")
