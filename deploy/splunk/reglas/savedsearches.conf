[DL - Salto de directorio hacia ficheros fuera de la raiz web]
description = El servidor solo deberia servir lo que cuelga de su raiz. Una peticion que sube niveles con secuencias de punto-punto busca lo que hay fuera: credenciales, claves y ficheros de configuracion. La variante que de verdad se escapa de los filtros es la codificada dos veces, porque el proxy la normaliza una vez y la aplicacion la vuelve a decodificar, asi que el ataque solo se ve entero en el punto don
search = index="web" "c-uri" IN ("*../../*", "*..%2f..%2f*", "*%2e%2e%2f%2e%2e%2f*", "*..%5c..%5c*", "*%2e%2e%5c*", "*....//*", "*..;/*", "*%c0%ae%c0%ae*", "*..%c0%af*", "*..%ef%bc%8f*") OR "c-uri" IN ("*..%252f*", "*%252e%252e%252f*", "*..%255c*", "*%25252e%25252e*", "*%%32%65%%32%65*") OR "c-uri" IN ("*/etc/passwd*", "*/etc/shadow*", "*/proc/self/environ*", "*/proc/self/cmdline*", "*/var/log/auth.log*", "*/root/.ssh/id_rsa*", "*/.aws/credentials*", "*/wp-config.php*", "*/web.config*", "*\\windows\\win.ini*", "*/windows/system32/drivers/etc/hosts*") NOT ("c-uri" IN ("*.map", "*.css", "*.mjs"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
