[DL - Volcado de memoria de LSASS]
description = LSASS guarda las credenciales de las sesiones activas. Su volcado es el paso previo casi obligado al movimiento lateral. Detecta las tres vias habituales: herramientas conocidas, el uso de comsvcs.dll MiniDump via rundll32, y el acceso al proceso con permisos de lectura de memoria registrado por Sysmon.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine="*comsvcs.dll*" CommandLine="*MiniDump*") OR (Image IN ("*\\procdump.exe", "*\\procdump64.exe", "*\\dumpert.exe", "*\\nanodump.exe") OR OriginalFileName IN ("procdump", "procdump64.exe") CommandLine="*lsass*") OR (CommandLine="*rundll32*" CommandLine="*dbghelp*" CommandLine="*MiniDumpWriteDump*")
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Volcado de memoria de LSASS
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1003.001
# Regla Sigma: rules\windows\soc_edr_001_volcado_lsass.yml
# UUID: 84045599-ca95-50f1-86c8-66d8351fc0e8

[DL - Acceso a memoria de LSASS con permisos de lectura]
description = Complemento de la deteccion por linea de comandos. Sysmon registra en el evento 10 todo acceso a un proceso; un GrantedAccess de 0x1010, 0x1410 o 0x1438 sobre lsass.exe corresponde a los permisos que necesita un volcado de memoria. Detecta tambien las implementaciones propias que no usan herramientas conocidas.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe" GrantedAccess IN ("0x1010", "0x1410", "0x1438", "0x143a", "0x1fffff") NOT (SourceImage IN ("C:\\Windows\\System32\\*", "C:\\Windows\\SysWOW64\\*", "C:\\Program Files\\Windows Defender\\*"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Acceso a memoria de LSASS con permisos de lectura
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1003.001
# Regla Sigma: rules\windows\soc_edr_002_acceso_lsass_sysmon.yml
# UUID: 9b92970e-32f3-52ad-8234-2649fd2a6d8b

[DL - Destruccion de copias de seguridad y puntos de restauracion]
