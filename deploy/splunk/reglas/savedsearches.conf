search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine IN ("* -enc *", "* -EncodedCommand*", "* -e JAB*", "*FromBase64String*", "*[Convert]::FromBase64*", "*-nop -w hidden*", "*-NoProfile -WindowStyle Hidden*", "*IEX(New-Object*", "*iex (New-Object*", "*[Reflection.Assembly]::Load*", "*-ExecutionPolicy Bypass*")
cron_schedule = */15 * * * *
