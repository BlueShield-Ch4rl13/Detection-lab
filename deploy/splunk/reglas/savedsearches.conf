[DL - Modificacion de un fichero de dependencias o lockfile]
description = Pilar de cadena de suministro software. El lockfile es lo que garantiza que lo que se compila hoy es lo mismo que se auditó ayer. Modificarlo fuera de un commit revisado, sobre todo en un servidor de compilacion, es la forma limpia de introducir una dependencia maliciosa sin tocar el codigo fuente.
search = TargetFilename IN ("*/package-lock.json", "*/yarn.lock", "*/pnpm-lock.yaml", "*/poetry.lock", "*/Pipfile.lock", "*/requirements.txt", "*/go.sum", "*/Cargo.lock", "*/composer.lock", "*/Gemfile.lock") NOT (Image IN ("*/git", "*/npm", "*/yarn", "*/pnpm", "*/poetry", "*/pip", "*/pip3", "*/go", "*/cargo", "*/composer", "*/bundle"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Modificacion de un fichero de dependencias o lockfile
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
