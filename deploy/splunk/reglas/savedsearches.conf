[DL - Kerberoasting - solicitud masiva de tickets de servicio con RC4]
description = Detecta solicitudes de ticket de servicio (TGS) cifradas con RC4 contra cuentas de servicio. Un atacante pide el TGS de cuentas con SPN para crackear su contrasena fuera de linea. El cifrado RC4 (0x17) es la senal: los clientes modernos negocian AES, asi que un RC4 solicitado por un puesto de usuario es anomalo.
search = source="WinEventLog:Security" EventCode=4769 TicketOptions="0x40810000" TicketEncryptionType="0x17" NOT (ServiceName IN ("*$", "krbtgt"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Kerberoasting - solicitud masiva de tickets de servicio con RC4
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1558.003
# Regla Sigma: rules\windows\soc_ad_001_kerberoasting.yml
# UUID: 54b36280-b579-5b0d-af3a-3ff82ad085f2

[DL - AS-REP Roasting - peticion sin preautenticacion Kerberos]
description = Detecta peticiones de autenticacion Kerberos (AS-REQ) sobre cuentas que tienen deshabilitada la preautenticacion. El atacante recibe material cifrado con la contrasena del usuario y lo craquea sin tocar el dominio. Se apoya en el evento 4768 con PreAuthType 0.
search = source="WinEventLog:Security" EventCode=4768 PreAuthType=0 TicketEncryptionType="0x17" NOT TargetUserName="*$"
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = AS-REP Roasting - peticion sin preautenticacion Kerberos
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1558.004
# Regla Sigma: rules\windows\soc_ad_002_asrep_roasting.yml
