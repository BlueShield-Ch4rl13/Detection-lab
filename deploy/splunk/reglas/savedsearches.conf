[DL - DCSync - replicacion de directorio desde un equipo que no es DC]
description = Detecta el uso de los permisos de replicacion de Active Directory para extraer hashes de contrasena, la tecnica que usa mimikatz lsadump::dcsync. Se identifica por el acceso a los GUID de extended right de replicacion en el evento 4662. Si el solicitante no es una cuenta de equipo controlador de dominio, es un ataque.
search = source="WinEventLog:Security" EventCode=4662 Properties IN ("*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*", "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*", "*89e95b76-444d-4c62-991a-0facbeda640c*") NOT (SubjectUserName="*$" OR SubjectUserName IN ("ANONYMOUS LOGON", "SYSTEM"))
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = DCSync - replicacion de directorio desde un equipo que no es DC
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1003.006
# Regla Sigma: rules\windows\soc_ad_003_dcsync.yml
# UUID: c99d10d7-e44d-5516-b637-3ec1ccf42c9e

[DL - Indicio de Golden Ticket - TGS de krbtgt con cifrado degradado]
description = Un Golden Ticket es un TGT forjado con el hash de krbtgt. Mimikatz lo genera por defecto con RC4, asi que una peticion de servicio que involucra a krbtgt con cifrado 0x17 desde un equipo que no es DC es sospechosa. Complementar siempre con revision del ticket lifetime, que en los tickets forjados suele ser de 10 anos.
search = source="WinEventLog:Security" EventCode=4769 ServiceName="krbtgt*" TicketEncryptionType="0x17"
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Indicio de Golden Ticket - TGS de krbtgt con cifrado degradado
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
