[DL - Deserializacion insegura de datos controlados por el cliente]
description = Deserializar es reconstruir objetos, y reconstruir un objeto ejecuta codigo del propio lenguaje antes de que la aplicacion valide nada: por eso una cadena serializada que llega del cliente vale como ejecucion remota sin vulnerabilidad de memoria. La ventaja para la deteccion es que cada formato tiene cabecera fija: el flujo Java empieza por los mismos cuatro bytes, PHP declara tipo y longitud, y e
search = index="web" \
| rex field=c-uri "(?<c-uriMatch>O:[0-9]{1,3}:\")" \
| eval c-uriCondition=if(isnotnull(c-uriMatch), "true", "false") \
| search "c-uri" IN ("*rO0AB*", "*aced0005*", "*%ac%ed%00%05*", "*rO0ABXNyA*", "*javax.management.BadAttributeValueExpException*") OR "c-uri" IN ("*AAEAAAD/////*", "*AAEAAAD%2F%2F%2F%2F%2F*", "*ObjectDataProvider*", "*System.Configuration.Install.AssemblyInstaller*", "*TypeConfuseDelegate*", "*$type\":\"System.*") OR "c-uri" IN ("*_$$ND_FUNC$$_*", "*!ruby/object:*", "*!!python/object/apply*", "*!!javax.script.ScriptEngineManager*", "*!!com.sun.rowset.JdbcRowSetImpl*", "*c__builtin__*", "*csubprocess*") OR "c-uri" IN ("*__proto__*", "*%5f%5fproto%5f%5f*", "*constructor[prototype]*", "*constructor%5bprototype%5d*") OR ("c-uri"="*=*" "c-uriCondition"="true" OR "c-uri" IN ("*__destruct*", "*__wakeup*", "*phar://*", "*a:2:{i:0;*", "*O%3A8%3A%22*"))
cron_schedule = */5 * * * *
