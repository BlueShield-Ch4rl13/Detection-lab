[DL - Exclusion anadida al antivirus]
description = Una exclusion es la forma mas silenciosa de cegar al antivirus: no apaga nada, no genera error y deja un hueco permanente donde el malware se ejecuta sin analisis. Se mira el registro y no la linea de comandos porque Add-MpPreference con -ExclusionPath, -ExclusionProcess o -ExclusionExtension aterriza en esta misma clave, igual que la exclusion empujada por GPO o por la API, y asi se ven las tres 
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode IN (12, 13, 14) TargetObject IN ("*\\Windows Defender\\Exclusions\\Paths\\*", "*\\Windows Defender\\Exclusions\\Processes\\*", "*\\Windows Defender\\Exclusions\\Extensions\\*", "*\\Windows Defender\\Exclusions\\IpAddresses\\*", "*\\Windows Defender\\Exclusions\\TemporaryPaths\\*", "*\\Windows Defender Exploit Guard\\ASR\\ASROnlyExclusions\\*") TargetObject IN ("*\\AppData\\*", "*\\Users\\Public\\*", "*\\Temp\\*", "*\\ProgramData\\*", "*\\PerfLogs\\*", "*\\$Recycle.Bin\\*", "*\\Downloads\\*", "*.exe*", "*.dll*", "*.ps1*", "*.bat*", "*.vbs*", "*.scr*")
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Exclusion anadida al antivirus
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1112,T1562.001
# Regla Sigma: rules\xdr\xdr_002_exclusiones_antivirus.yml
# UUID: f2911a10-3ceb-586b-ac05-7f270c3b4561

[DL - Reglas ASR desactivadas o puestas en auditoria]
description = Las reglas de reduccion de superficie de ataque son las que cortan el patron de Office lanzando interpretes, las macros que descargan y el robo de credenciales de LSASS. Pasarlas a Disabled o a AuditMode las deja registrando sin bloquear, que es peor que apagarlas porque el panel sigue en verde. El cambio legitimo llega por Intune o GPO sobre el parque entero; aqui se ve un equipo suelto cambiando
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine="*AttackSurfaceReductionRules_Actions*" CommandLine IN ("*Disabled*", "*AuditMode*", "*Warn*", "*Actions 0*", "*Actions 2*")) OR CommandLine IN ("*Remove-MpPreference -AttackSurfaceReductionRules_Ids*", "*AttackSurfaceReductionOnlyExclusions*") OR CommandLine IN ("*Windows Defender Exploit Guard\\ASR\\Rules*", "*Windows Defender Exploit Guard\\Controlled Folder Access*", "*Windows Defender Exploit Guard\\Network Protection*", "*EnableControlledFolderAccess*", "*EnableNetworkProtection*")
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Reglas ASR desactivadas o puestas en auditoria
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1112,T1562.001
# Regla Sigma: rules\xdr\xdr_003_reglas_asr_desactivadas.yml
# UUID: dd15d35d-deb4-58ee-89a9-da35a6b7c576

[DL - Carga de driver vulnerable conocido]
description = BYOVD: el atacante trae un driver firmado y legitimo con una vulnerabilidad que le da lectura y escritura en memoria de kernel, y desde ahi mata los procesos protegidos del EDR sin tocar ni un servicio. Filtrar por firma no sirve, porque estos ficheros estan correctamente firmados; lo que los delata es el nombre y el hecho de que ningun equipo del parque tiene motivo para cargarlos.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=6 ImageLoaded IN ("*\\RTCore64.sys", "*\\DBUtil_2_3.sys", "*\\gdrv.sys", "*\\iqvw64e.sys", "*\\procexp152.sys", "*\\aswArPot.sys", "*\\kprocesshacker.sys", "*\\viragt64.sys", "*\\truesight.sys", "*\\mhyprot2.sys", "*\\dbk64.sys", "*\\WinRing0x64.sys", "*\\speedfan.sys", "*\\ucorew64.sys") OR (ImageLoaded IN ("*\\Users\\*", "*\\AppData\\*", "*\\Temp\\*", "*\\ProgramData\\*", "*\\PerfLogs\\*", "*\\$Recycle.Bin\\*") SignatureStatus IN ("Unavailable", "Expired", "Revoked", "Untrusted", "Invalid"))
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Carga de driver vulnerable conocido
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1068,T1562.001
# Regla Sigma: rules\xdr\xdr_004_driver_vulnerable_byovd.yml
# UUID: aff7e57c-74cd-5ce2-a1ee-a5329b52a838

[DL - Manipulacion del canal de telemetria ETW]
description = Antes de actuar, el atacante corta la fuente en lugar de borrar el resultado: para DiagTrack, desactiva el autologger que alimenta al sensor o apaga un canal concreto con wevtutil. El ataque es mas limpio que borrar registros porque no deja el evento 1102 ni un hueco evidente, simplemente el equipo deja de contar cosas. La regla exige que wevtutil venga con /e:false, para no repetir la deteccion g
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 CommandLine IN ("*stop DiagTrack*", "*delete DiagTrack*", "*config DiagTrack*", "*Stop-Service DiagTrack*", "*Set-Service DiagTrack*", "*stop diagnosticshub.standardcollector.service*") OR CommandLine IN ("*\\WMI\\Autologger\\*", "*Autologger\\EventLog-*", "*Autologger\\DefenderApiLogger*", "*Autologger\\DefenderAuditLogger*", "*Autologger\\SenseEventLog*", "*Autologger\\Diagtrack-Listener*") OR CommandLine IN ("*Set-EtwTraceProvider*", "*Remove-EtwTraceProvider*", "*Remove-EtwTraceSession*") OR (CommandLine IN ("*wevtutil sl*", "*wevtutil.exe sl*", "*Set-LogProperties*") CommandLine IN ("*/e:false*", "*/enabled:false*", "*-Enabled $false*")) OR (CommandLine IN ("*logman stop*", "*logman.exe stop*", "*logman update trace*", "*logman.exe update trace*") CommandLine IN ("*-ets*", "*EventLog-*", "*Autologger*", "*DefenderApiLogger*", "*SenseEvent*"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Manipulacion del canal de telemetria ETW
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1562.002,T1562.006
# Regla Sigma: rules\xdr\xdr_005_telemetria_etw_manipulada.yml
# UUID: df839973-dc16-57d5-a385-a791c31c0cdd

[DL - Arranque en modo seguro forzado por bcdedit]
description = En modo seguro solo arrancan los servicios registrados bajo la clave SafeBoot, y la mayoria de los EDR no estan ahi: el equipo levanta ciego. Es la maniobra previa tipica del ransomware, que anade su propio servicio a SafeBoot\Minimal y reinicia para cifrar sin vigilancia. Un cambio de configuracion de arranque en un puesto de usuario no tiene explicacion operativa; en soporte se hace desde el men
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 CommandLine IN ("*/set safeboot*", "*/set {default} safeboot*", "*/set {current} safeboot*", "*safeboot minimal*", "*safeboot network*", "*Set-BcdElement -Element safeboot*", "*safebootalternateshell*") OR (CommandLine IN ("*Control\\SafeBoot\\Minimal*", "*Control\\SafeBoot\\Network*") CommandLine IN ("*reg add*", "*reg delete*", "*reg.exe add*", "*reg.exe delete*", "*New-ItemProperty*", "*Set-ItemProperty*", "*Remove-Item*"))
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Arranque en modo seguro forzado por bcdedit
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1112,T1562.009
# Regla Sigma: rules\xdr\xdr_006_arranque_modo_seguro.yml
# UUID: 7e1ef1be-ea1d-528d-b861-c463a02f6d1f

[DL - Montaje de almacenamiento extraible]
description = Pilar de dispositivos y de datos. Un USB conectado a un equipo con acceso a recursos corporativos es a la vez via de entrada de codigo y via de salida de datos. En un entorno Zero Trust maduro el almacenamiento extraible esta bloqueado por politica; verlo montado significa que la politica no se aplica en ese equipo.
search = source="WinEventLog:Security" EventCode=6416 ClassName IN ("*DiskDrive*", "*USB*", "*WPD*")
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Montaje de almacenamiento extraible
action.notable.param.security_domain = threat
action.notable.param.severity = medium
