[DL - Cuenta de equipo creada por un usuario no administrador]
description = Por defecto cualquier usuario del dominio puede dar de alta hasta diez equipos (MachineAccountQuota). Esa cuota es el punto de partida de ataques como noPac, sAMAccountName spoofing y la escalada por delegacion basada en recursos. El alta de una cuenta de equipo por un usuario que no es del equipo de sistemas merece revision.
search = source="WinEventLog:Security" EventCode=4741 NOT SubjectUserName="*$"
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
