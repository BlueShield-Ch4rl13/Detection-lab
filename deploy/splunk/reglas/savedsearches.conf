[DL - Reenvio automatico de correo a dominio personal]
description = Exfiltracion continua y sin esfuerzo: una vez puesta la regla, cada correo que llegue al buzon sale solo hacia una cuenta que la empresa no controla. Se diferencia de la deteccion generica de reglas de buzon en que aqui se exige que el destino sea un proveedor de correo de consumo, lo que descarta el reenvio entre buzones corporativos y convierte el aviso en algo accionable: o es cuenta comprometi
