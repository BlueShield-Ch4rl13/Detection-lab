[DL - Descenso de version a WDigest para cachear credenciales en claro]
description = Desde Windows 8.1 WDigest ya no guarda la contrasena en claro en memoria, salvo que UseLogonCredential valga 1. Escribir ese valor no roba nada por si solo: prepara el terreno para que el siguiente inicio de sesion, idealmente el de un administrador, deje la contrasena legible en LSASS, asi que la alerta llega antes que el volcado. Lo mismo vale para apagar RunAsPPL o Credential Guard: ningun prod
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode IN (12, 13, 14) (TargetObject="*\\SecurityProviders\\WDigest\\UseLogonCredential" Details="*0x00000001*") OR (TargetObject IN ("*\\Control\\Lsa\\RunAsPPL", "*\\Control\\Lsa\\LsaCfgFlags", "*\\Control\\Lsa\\DisableRestrictedAdmin") Details="*0x00000000*") OR TargetObject="*\\Control\\Lsa\\TokenLeakDetectDelaySecs"
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Descenso de version a WDigest para cachear credenciales en claro
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1003.001,T1112
# Regla Sigma: rules\windows\cred_004_descenso_wdigest.yml
# UUID: 74fe15a7-3458-5317-9767-cca3e3939904

[DL - Robo de ficheros de credenciales de nube y de SSH]
description = Las claves de AWS, Azure, GCP, Kubernetes y SSH viven en ficheros de texto dentro del perfil del usuario, casi nunca caducan y no pasan por el segundo factor. Un solo fichero copiado convierte un puesto comprometido en acceso persistente a la infraestructura, y ese acceso ya se ejerce fuera del alcance del EDR. Los clientes legitimos leen esos ficheros desde su propio proceso, no con type, copy ni
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine IN ("*\\.aws\\credentials*", "*\\.aws\\config*", "*\\.azure\\accessTokens.json*", "*\\.azure\\azureProfile.json*", "*\\.kube\\config*", "*\\.docker\\config.json*", "*\\.ssh\\config*", "*id_rsa*", "*id_ed25519*", "*credentials.db*") CommandLine IN ("*type *", "*more *", "*copy *", "*xcopy*", "*robocopy*", "*Get-Content*", "*Copy-Item*", "*Compress-Archive*", "*findstr*", "*tar *")) OR (CommandLine="*dir *" CommandLine="*/s*" CommandLine IN ("*id_rsa*", "*.pem*", "*credentials*"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Robo de ficheros de credenciales de nube y de SSH
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1552.001,T1552.004
# Regla Sigma: rules\windows\cred_005_credenciales_nube_ssh.yml
# UUID: c79d5ef3-0b6d-5226-9b40-1a0cd438111b

[DL - Acceso a bases de datos de gestores de contrasenas]
description = Una base de KeePass o el almacen local de 1Password o Bitwarden concentra en un unico fichero las credenciales que el usuario considera mas sensibles, casi siempre las de administracion. El atacante no necesita romper nada en el equipo: se lleva el fichero y ataca la clave maestra fuera de la red, sin ruido y sin limite de intentos. El gestor abre su base desde su propio proceso, nunca por copia n
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine IN ("*.kdbx*", "*.kdb*", "*.psafe3*", "*.opvault*", "*KeePass.config.xml*", "*\\Bitwarden\\data.json*", "*\\1Password\\*", "*\\KeePassXC\\*") CommandLine IN ("*copy *", "*Copy-Item*", "*xcopy*", "*robocopy*", "*Compress-Archive*", "*Get-Content*", "*Get-ChildItem*", "*dir *", "*-Recurse*")) OR Image IN ("*\\KeeThief.exe", "*\\KeeFarce.exe", "*\\LaZagne.exe") OR CommandLine IN ("*KeeThief*", "*KeeFarce*", "*Get-KeePassDatabaseKey*", "*lazagne*")
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Acceso a bases de datos de gestores de contrasenas
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1555.005
# Regla Sigma: rules\windows\cred_006_gestores_contrasenas.yml
# UUID: 404beb95-b0b8-5224-a7fd-7cf271361022

[DL - Volcado de credenciales cacheadas y del Administrador de credenciales de Windows]
description = Windows conserva los ultimos inicios de sesion de dominio como hashes MSCache y las credenciales guardadas del usuario en la boveda, que se descifra con DPAPI dentro de esa misma sesion. Es a lo que recurre el atacante cuando no hay ninguna sesion privilegiada viva que volcar de LSASS: le permite seguir moviendose aunque el administrador ya se haya desconectado. Enumerar la boveda entera no es alg
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image="*\\cmdkey.exe" CommandLine IN ("*/list*", "*/l *")) OR (Image="*\\vaultcmd.exe" CommandLine IN ("*/list*", "*/listcreds*", "*/listschema*")) OR CommandLine IN ("*lsadump::cache*", "*vault::cred*", "*vault::list*", "*sekurlsa::credman*") OR CommandLine IN ("*SECURITY\\Cache*", "*SECURITY\\Policy\\Secrets*") OR Image IN ("*\\CredentialsFileView.exe", "*\\VaultPasswordView.exe", "*\\netpass.exe") OR CommandLine IN ("*Invoke-WCMDump*", "*Get-VaultCredential*", "*CredentialsFileView*", "*VaultPasswordView*")
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Volcado de credenciales cacheadas y del Administrador de credenciales de Windows
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
