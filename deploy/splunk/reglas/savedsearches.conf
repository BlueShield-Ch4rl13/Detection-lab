[DL - Cross-site scripting reflejado en la peticion]
description = En el XSS reflejado el payload viaja en la peticion y la aplicacion lo devuelve dentro de la respuesta, de modo que se ejecuta en el navegador de la victima con su sesion. Marcar una etiqueta HTML suelta llena la cola de ruido: lo que no aparece en trafico normal es la etiqueta acompanada de un vector de ejecucion, sea manejador de evento, esquema javascript o acceso a la cookie. Se exige 200 porq
search = index="web" "sc-status"="200" "cs-method" IN ("GET", "POST") "c-uri" IN ("*<script>alert(*", "*%3Cscript%3Ealert*", "*\"><script*", "*%22%3E%3Cscript*", "*<svg/onload=*", "*<svg%2Fonload*", "*onerror=alert*", "*onerror%3Dalert*", "*javascript:alert(*", "*document.location=document.cookie*") OR ("c-uri" IN ("*<script*", "*%3Cscript*", "*<img*", "*%3Cimg*", "*<svg*", "*%3Csvg*", "*<iframe*", "*%3Ciframe*", "*<body*", "*<details*") "c-uri" IN ("*onerror=*", "*onload=*", "*onmouseover=*", "*onfocus=*", "*ontoggle=*", "*onanimationstart=*", "*javascript:*", "*document.cookie*", "*string.fromcharcode*", "*eval(*", "*fetch(*")) NOT ("c-uri" IN ("*/wp-admin/post.php*", "*/ckeditor/*", "*/tinymce/*", "*/admin/content/edit*"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Cross-site scripting reflejado en la peticion
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
