[DL - Consentimiento concedido a una aplicacion no verificada]
description = El illicit consent grant no roba la contrasena: convence al usuario de dar permisos a una aplicacion controlada por el atacante, que a partir de ahi lee correo y ficheros sin necesitar credenciales ni MFA. Sobrevive a un cambio de contrasena, lo que lo hace especialmente incomodo en respuesta a incidentes.
search = index="idp" sourcetype="azure:aad:audit" properties.message IN ("Consent to application", "Add delegated permission grant", "Add app role assignment grant to user") TargetResources IN ("*Mail.Read*", "*Mail.ReadWrite*", "*Mail.Send*", "*Files.ReadWrite.All*", "*Directory.ReadWrite.All*", "*User.ReadWrite.All*", "*offline_access*")
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Consentimiento concedido a una aplicacion no verificada
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1550.001
# Regla Sigma: rules\cloud\soc_cld_001_consentimiento_oauth.yml
# UUID: 95f7a7fa-56a0-5b5e-9dca-02cbde4b8404

[DL - Metodo MFA registrado tras un inicio de sesion de riesgo]
