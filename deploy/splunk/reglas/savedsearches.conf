[DL - Copia masiva de documentos a unidad extraible]
description = La via de salida que no pasa por el proxy ni por el correo. Como el evento de escritura en disco es de los mas ruidosos que existe, la regla exige cuatro cosas a la vez: destino fuera de la unidad de sistema, extension de documento o de contenedor, un proceso de copia o de archivado como origen, y que la ruta no sea de copia de seguridad. Completa a la regla de montaje de almacenamiento extraible,
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11 TargetFilename IN ("D:\\*", "E:\\*", "F:\\*", "G:\\*", "H:\\*", "I:\\*", "J:\\*") TargetFilename IN ("*.doc", "*.docx", "*.xls", "*.xlsx", "*.ppt", "*.pptx", "*.pdf", "*.csv", "*.pst", "*.ost", "*.zip", "*.rar", "*.7z", "*.kdbx", "*.sql", "*.bak") Image IN ("*\\explorer.exe", "*\\cmd.exe", "*\\powershell.exe", "*\\pwsh.exe", "*\\robocopy.exe", "*\\xcopy.exe", "*\\7z.exe", "*\\rar.exe", "*\\winrar.exe", "*\\TOTALCMD64.EXE", "*\\FreeCommander.exe") NOT (TargetFilename IN ("*\\Backup\\*", "*\\Veeam*", "*\\WindowsImageBackup\\*", "*\\System Volume Information\\*", "*\\$RECYCLE.BIN\\*"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
