[DL - Exfiltracion por protocolo alternativo]
description = Cuando el proxy filtra la salida web, el dato se va por donde nadie mira: ICMP con carga util llena, FTP en claro o un recurso SMB hacia una direccion de fuera. Para el ICMP se pide la herramienta y un tamano de paquete grande a la vez, porque un ping suelto es trafico normal y un ping de 65500 bytes repetido es un canal. El FTP y el SMB salientes se marcan siempre: en una red corporativa moderna 
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image IN ("*\\ping.exe", "*\\hping3.exe", "*\\nping.exe") CommandLine IN ("* -l 65500*", "* -l 32767*", "* -l 16384*", "* -l 8192*", "* -l 4096*", "* -l 2048*", "* -l 1472*", "* -l 1400*", "* -l 1024*", "*--data-size*", "*--data-string*")) OR CommandLine IN ("*ftp -s:*", "*ftp.exe -s:*", "*ftp -n -i -s*", "*curl ftp://*", "*ftp://*", "*Net.FtpWebRequest*", "*WinSCP.com /command*", "*pscp.exe *", "*psftp.exe -b*") OR (CommandLine IN ("*net use \\*", "*net.exe use \\*", "*New-PSDrive -Root \\*", "*copy \\*", "*robocopy \\*") NOT (CommandLine IN ("*.midominio.local*", "*\\10.*", "*\\192.168.*", "*\\172.16.*", "*\\172.17.*", "*\\172.18.*", "*\\172.19.*", "*\\172.2*", "*\\172.30.*", "*\\172.31.*", "*\\127.0.0.1*", "*\\localhost*")))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Exfiltracion por protocolo alternativo
action.notable.param.security_domain = threat
action.notable.param.severity = high
