search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image IN ("*\\Certify.exe", "*\\Certipy.exe") OR CommandLine IN ("*Certify.exe request*", "*certipy req*", "*certipy auth*", "*Rubeus.exe asktgt*") OR (CommandLine="*certreq*" CommandLine="*san:*")
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
