[DL - Inyeccion SQL en parametros de la peticion HTTP]
description = Una cadena de consulta normal lleva identificadores, fechas y texto de busqueda: no lleva la gramatica de un motor SQL. Lo que separa el ataque del trafico legitimo no es la palabra suelta sino la combinacion de un parametro con construcciones que solo tienen sentido si el valor se concatena dentro de la sentencia: union de conjuntos, condiciones siempre ciertas, funciones de espera y lectura del 
search = index="web" "c-uri"="*=*" "c-uri" IN ("*union select*", "*union+select*", "*union%20select*", "*union all select*", "*union%0aselect*", "*union%23%0aselect*", "*union%09select*") OR "c-uri" IN ("*' or 1=1*", "*' or '1'='1*", "*') or ('1'='1*", "*' or 'a'='a*", "*' and 1=2*", "*admin'--*", "*%27%20or%201%3d1*", "*%27+or+%271%27%3d%271*") OR "c-uri" IN ("*sleep(5)*", "*sleep(10)*", "*pg_sleep(*", "*waitfor delay*", "*benchmark(10000*", "*dbms_pipe.receive_message*") OR "c-uri" IN ("*information_schema.tables*", "*information_schema.columns*", "*sys.databases*", "*@@version*", "*group_concat(*", "*extractvalue(*", "*updatexml(*", "*load_file(*", "*into outfile*") NOT ("c-uri" IN ("*/phpmyadmin/*", "*/adminer.php*", "*/pgadmin4/*", "*/_sql/*"))
