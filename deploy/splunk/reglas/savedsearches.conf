[DL - Archivado masivo previo a la exfiltracion]
description = El paso que casi nunca falta antes de sacar datos: comprimir lo recolectado en un solo fichero, ponerle contrasena para que el DLP no lo lea y partirlo en volumenes para que pase por el proxy sin destacar por tamano. La regla exige la combinacion de un archivador con una opcion de cifrado o troceado, o con una ruta de documentos, para no disparar con cada descompresion normal de un adjunto.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image IN ("*\\rar.exe", "*\\winrar.exe", "*\\7z.exe", "*\\7za.exe", "*\\7zg.exe", "*\\7zr.exe", "*\\zip.exe", "*\\tar.exe", "*\\makecab.exe", "*\\wzzip.exe", "*\\peazip.exe") OR CommandLine IN ("*Compress-Archive*", "*System.IO.Compression.ZipFile*", "*ZipFile]::CreateFromDirectory*") CommandLine IN ("* -hp*", "* -p*", "*-mhe=on*", "* -v*", "* -m5*", "* -ssw*", "* -r *", "*-t7z*", "*--password*") OR CommandLine IN ("*\\Documents\\*", "*\\Desktop\\*", "*\\Downloads\\*", "*\\Users\\Public\\*", "*.pst*", "*.ost*", "*.docx*", "*.xlsx*", "*.pdf*", "*.kdbx*")
