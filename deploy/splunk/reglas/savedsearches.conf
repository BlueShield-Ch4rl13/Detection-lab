search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image="*\\vssadmin.exe" CommandLine="*delete*" CommandLine="*shadows*") OR (Image="*\\wmic.exe" CommandLine="*shadowcopy*" CommandLine="*delete*") OR (Image="*\\wbadmin.exe" CommandLine="*delete*" CommandLine="*catalog*") OR (Image="*\\bcdedit.exe" CommandLine IN ("*recoveryenabled no*", "*bootstatuspolicy ignoreallfailures*")) OR CommandLine IN ("*Get-WmiObject Win32_Shadowcopy*", "*Remove-Item -Path C:\\Windows\\System32\\Recovery*")
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Destruccion de copias de seguridad y puntos de restauracion
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
