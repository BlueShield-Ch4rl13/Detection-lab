[DL - Cuenta de servicio con inicio de sesion interactivo]
description = Pilar de identidad. Una cuenta de servicio existe para que la use un proceso, no una persona. Un inicio de sesion interactivo o por escritorio remoto con una de ellas significa que alguien tiene su contrasena, y esas contrasenas casi nunca caducan ni llevan MFA.
search = source="WinEventLog:Security" EventCode=4624 LogonType IN (2, 7, 10, 11) TargetUserName IN ("svc_*", "srv_*", "sa_*", "app_*") NOT TargetUserName="*$"
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Cuenta de servicio con inicio de sesion interactivo
action.notable.param.security_domain = threat
