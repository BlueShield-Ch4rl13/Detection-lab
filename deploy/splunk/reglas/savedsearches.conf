[DL - Carga de libreria desde una ruta no estandar]
description = Pilar de cadena de suministro software. Un proceso del sistema cargando una DLL desde una ruta escribible por el usuario es secuestro de orden de busqueda o sideloading: el binario es legitimo y esta firmado, la libreria no. Es la tecnica que mas veces sobrevive a un antivirus, porque lo que se ejecuta esta en la lista blanca.
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=7 ImageLoaded IN ("*\\AppData\\Local\\Temp\\*", "*\\AppData\\Roaming\\*", "*\\Users\\Public\\*", "*\\ProgramData\\*", "*\\Windows\\Temp\\*", "*\\$Recycle.Bin\\*") ImageLoaded="*.dll" NOT ((Signed="true" SignatureStatus="Valid") OR Image IN ("*\\msiexec.exe", "*\\TrustedInstaller.exe", "*\\setup.exe"))
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Carga de libreria desde una ruta no estandar
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1574.001,T1574.002
# Regla Sigma: rules\zta\zta_sup_001_libreria_ruta_no_estandar.yml
# UUID: e82ffea5-13cf-5426-80a7-c5e7f25c2e1c

[DL - Instalacion de paquete desde un repositorio no aprobado]
description = Pilar de cadena de suministro software. Instalar directamente desde un indice publico o desde una URL salta el repositorio interno, y con el se saltan el escaneo de vulnerabilidades, la firma y el inventario. Es tambien la via por la que entra un paquete con nombre confundible (typosquatting).
search = index="endpoint" sourcetype="linux:audit" Image IN ("*/pip", "*/pip3", "*/npm", "*/yarn", "*/gem", "*/go", "*/cargo", "*/composer") CommandLine IN ("*install git+*", "*install http://*", "*install https://*", "*--index-url*", "*--extra-index-url*", "*--registry*", "*install github.com/*") OR (CommandLine="*curl*" CommandLine="*install*") NOT (CommandLine IN ("*repo.midominio.local*", "*nexus.midominio.local*", "*artifactory.midominio.local*"))
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Instalacion de paquete desde un repositorio no aprobado
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1195.001,T1195.002
