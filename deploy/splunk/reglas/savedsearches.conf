[DL - Adjunto con formato usado para entrega de malware]
description = Contenedores y formatos que se usan para saltarse la marca de zona y los controles de macro: ISO, IMG, VHD, LNK dentro de ZIP, OneNote con adjunto incrustado y ficheros con doble extension.
search = index="email" sourcetype="proofpoint:tap" \
| rex field=attachmentName "(?<attachmentNameMatch>.*\\.(pdf|doc|docx|xls|xlsx|jpg|png)\\s*\\.(exe|scr|js|vbs|bat|cmd|ps1)$)" \
| eval attachmentNameCondition=if(isnotnull(attachmentNameMatch), "true", "false") \
| search attachmentName IN ("*.iso", "*.img", "*.vhd", "*.vhdx", "*.one", "*.lnk", "*.chm", "*.hta") OR attachmentNameCondition="true" OR attachmentName IN ("*.docm", "*.xlsm", "*.pptm", "*.xlam")
