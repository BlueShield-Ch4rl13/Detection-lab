[DL - Escape de contenedor hacia los namespaces del host]
description = nsenter contra el PID 1, chroot sobre un /host montado o la escritura de release_agent en cgroups son las tres rutas clasicas para salir de un contenedor privilegiado y ejecutar en el nodo.
search = index="endpoint" sourcetype="linux:audit" (Image="*/nsenter" CommandLine IN ("*-t 1*", "*--target 1*", "*--mount=/proc/1/ns/mnt*")) OR (Image="*/chroot" CommandLine IN ("*/host*", "*/mnt/host*", "*/proc/1/root*")) OR CommandLine IN ("*release_agent*", "*notify_on_release*") OR CommandLine="*/proc/1/root*"
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Escape de contenedor hacia los namespaces del host
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1611
# Regla Sigma: rules\contenedores\cont_escape_a_namespaces_host.yml
# UUID: d4e7c487-eb0b-5457-99f7-c59ad3143ecd

[DL - Acceso al socket del runtime de contenedores]
description = Quien puede hablar con /var/run/docker.sock o con el socket de containerd puede crear un contenedor privilegiado y montar el disco del host. Es el escape de contenedor mas comun y no requiere ningun exploit.
search = index="endpoint" sourcetype="linux:audit" CommandLine IN ("*/var/run/docker.sock*", "*/run/docker.sock*", "*/run/containerd/containerd.sock*", "*/var/run/crio/crio.sock*") CommandLine IN ("*curl*", "*wget*", "*nc *", "*socat*", "*docker run*", "*ctr *", "*crictl*") NOT (Image IN ("*/dockerd", "*/containerd", "*/kubelet"))
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
alert.severity = 6
alert.track = 1
alert.suppress = 1
alert.suppress.period = 60m
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.notable = 1
action.notable.param.rule_title = Acceso al socket del runtime de contenedores
action.notable.param.security_domain = threat
action.notable.param.severity = critical
action.notable.param.drilldown_name = Ver eventos de la deteccion
# MITRE ATT&CK: T1610,T1611
# Regla Sigma: rules\contenedores\cont_socket_runtime_accedido.yml
# UUID: 7d0e6088-9338-5a96-999a-8337650284ac

