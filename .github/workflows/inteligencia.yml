name: Refrescar inteligencia

# Los indicadores caducan. Una IP de mando y control de hace un mes es hoy, con
# frecuencia, un servidor legitimo reasignado, y una lista que no caduca acaba
# generando falsos positivos que nadie sabe de donde salen.
#
# Este workflow sincroniza con News CTI a diario y abre commit solo si algo
# cambio. No toca reglas ni consultas: solo intel/listas/ y las copias en
# deploy/*/.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sincronizar con News CTI
        run: python tools/sync_cti.py --max-dias 30

      - name: Copiar a las carpetas de cada SIEM
        run: |
          cp intel/listas/wazuh/*.cdb       deploy/wazuh/listas/
          cp intel/listas/splunk/*.csv      deploy/splunk/lookups/
          cp intel/listas/sentinel/*.csv    deploy/sentinel/watchlists/
          cp intel/listas/elastic/*.ndjson  deploy/elastic/indicadores/

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/ deploy/
          if git diff --staged --quiet; then
            echo "Sin cambios en los indicadores"
          else
            git commit -m "Inteligencia: refresco de indicadores desde News CTI"
            git push
          fi
