name: Validar reglas Sigma

on:
  push:
    paths:
      - 'rules/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'rules/**'
      - 'tools/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar reglas y medir cobertura ATT&CK
        run: python tools/validate.py

      - name: Publicar la capa de cobertura (ATT&CK Navigator)
        uses: actions/upload-artifact@v7
        with:
          name: attack-navigator-coverage
          path: navigator/coverage-layer.json
